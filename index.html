<!DOCTYPE html>
<html lang="es">
<head>

        .btn-secondary:hover { background-color: #007bb5; }

        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

</head>
<body>

<div class="container">

    <h1>Listado Equipos Eventos Corporativos</h1>

            <option value="PANTALLA LED">PANTALLA LED</option>
        </select>
    </div>

    <div class="form-group hidden" id="div-subcategoria">
        <label for="subcategoria" id="label-subcategoria">Subcategoría:</label>

    <div class="row form-group hidden" id="div-tipo-ensamble">

    </div>
    
    <div id="tabla-container" style="margin-top: 15px;">

<script>
    // Cargar la tabla apenas se abre la página
    window.onload = function() {
        cargarTabla();
    };

    function toggleEmailForm() {
        const form = document.getElementById("email-form");
        if (form.classList.contains("hidden")) {
            form.classList.remove("hidden");
        } else {
            form.classList.add("hidden");
        }
    }
    
    async function enviarCorreo() {
        const remitente = document.getElementById("email-remitente").value.trim();
        const password = document.getElementById("email-password").value.trim();
        const destinatario = document.getElementById("email-destinatario").value.trim();
        const asunto = document.getElementById("email-asunto").value.trim();
        
        if (!remitente || !password || !destinatario || !asunto) {
            showMessage("Por favor llena todos los campos, incluyendo la contraseña.", false);
            return;
        }
        
        showMessage("Enviando correo por Gmail... por favor espera.", true);
        
        try {
            const response = await fetch('/enviar-correo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    remitente: remitente,
                    password: password,
                    destinatario: destinatario,
                    asunto: asunto
                })
            });
            
            const result = await response.json();
            if (response.ok) {
                showMessage("✅ ¡Correo enviado exitosamente con el Excel adjunto!", true);
                document.getElementById("email-form").classList.add("hidden"); // Ocultar form
            } else {
                showMessage("❌ Error: " + result.detail, false);
            }
        } catch (error) {
            showMessage("❌ Error al intentar conectar con el servidor.", false);
            console.error(error);
        }
    }

    async function borrarListado() {
        if (!confirm("¿Estás seguro de que quieres borrar todo el listado de Excel? Esta acción no se puede deshacer.")) {
            return;
        }
        
        try {
            const response = await fetch('/borrar-listado', { method: 'POST' });
            const resData = await response.json();
            if (response.ok) {
                showMessage("Listado borrado exitosamente.", true);
                cargarTabla(); // Refrescar la tabla para que se vea vacía
            } else {
                showMessage("Error al borrar el listado: " + (resData.detail || "Verifica que el archivo Excel no esté abierto."), false);
            }
        } catch (error) {
            console.error("Error al borrar", error);
            showMessage("Error de conexión al intentar borrar.", false);
        }
    }

    async function cargarTabla() {
        try {
            const response = await fetch('/equipos');
            if (response.ok) {
                const data = await response.json();
                dibujarTabla(data);
            }
        } catch (error) {
            console.error("Error al cargar la tabla", error);
        }
    }

    function dibujarTabla(data) {
        const container = document.getElementById('tabla-container');
        container.innerHTML = '';

        for (const [categoria, equipos] of Object.entries(data)) {
            if (equipos.length === 0) continue;

            const table = document.createElement('table');
            table.style.width = '100%';
            table.style.borderCollapse = 'collapse';
            table.style.marginBottom = '20px';
            table.style.backgroundColor = '#2b2b2b'; table.style.color = '#fff';

            const thead = document.createElement('thead');
            thead.innerHTML = `
                <tr style="background-color: #111;">
                    <th colspan="2" style="padding: 10px; text-align: left; border: 1px solid #444; color: #4CAF50;">${categoria}</th>
                </tr>
                <tr style="background-color: #222;">
                    <th style="padding: 8px; text-align: left; border: 1px solid #444; width: 70%;">Equipo</th>
                    <th style="padding: 8px; text-align: center; border: 1px solid #444; width: 30%;">Cantidad</th>
                </tr>
            `;
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            equipos.forEach(eq => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="padding: 8px; border: 1px solid #444;">${eq.equipo}</td>
                    <td style="padding: 8px; text-align: center; border: 1px solid #444;">${eq.cantidad}</td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }

        if (container.innerHTML === '') {
            container.innerHTML = '<p style="text-align:center; color:#777;">No hay equipos registrados todavía.</p>';
        }
    }

    function verificarDimensiones() {
        const subcat = document.getElementById("subcategoria").value;
        const divDim = document.getElementById("div-dimensiones");
        const esCable20m = subcat.toLowerCase().includes("cable") && subcat.includes("20");
        const esPulpo = subcat.toLowerCase().includes("pulpo");
        const esBrazo = subcat.toLowerCase().includes("brazos");
        const esHamburguesaPitch = subcat.toLowerCase().includes("hamburguesa pantalla pitch");
        const esArmado = subcat.includes("Armado Completo");

        if (subcat.toLowerCase().includes("pitch") || subcat.toLowerCase().includes("puente") || subcat.toLowerCase().includes("patas") || subcat.toLowerCase().includes("escalerilla") || esCable20m || esPulpo || esBrazo || esHamburguesaPitch || esArmado) {
            divDim.classList.remove("hidden");

            if (subcat.toLowerCase().includes("escalerilla") || esHamburguesaPitch || esArmado) {
                document.getElementById("div-tipo-ensamble").classList.remove("hidden");
            } else {
                document.getElementById("div-tipo-ensamble").classList.add("hidden");
            }

            if (esCable20m || esArmado) {
                document.getElementById("div-tipo-pitch").classList.remove("hidden");
            } else {
                document.getElementById("div-tipo-pitch").classList.add("hidden");
            }
            
            if (esArmado) {
                document.getElementById("equipo").value = "Kit de Pantalla LED (Auto-Calculado)";
                document.getElementById("equipo").readOnly = true;
                document.getElementById("cantidad").readOnly = true;
            }
            calcularFormulas(); // Calcular en caso de que ya haya números
        } else {
            divDim.classList.add("hidden");
            document.getElementById("div-tipo-ensamble").classList.add("hidden");
            document.getElementById("div-tipo-pitch").classList.add("hidden");
            document.getElementById("dim-horizontal").value = "";
            document.getElementById("dim-vertical").value = "";
            // Restaurar equipo y cantidad a estado normal si cambiamos de categoría
            const equipoActual = document.getElementById("equipo").value;
            if (!equipoActual.toLowerCase().includes("racks de pantalla") && !equipoActual.toLowerCase().includes("puente") && !equipoActual.toLowerCase().includes("patas") && !equipoActual.toLowerCase().includes("escalerilla") && !equipoActual.toLowerCase().includes("microfono")) {
                document.getElementById("cantidad").readOnly = false;
            }
            
            const autoCompKeys = ["microfono", "Microfono", "Bose", "Consola", "Loe", "Tio", "Caja", "Antena", "Distribuidor", "Procesador", "Computador", "Imac", "Mac", "Presentador", "Capturadora", "Fibra", "Convertidor", "Truss", "Base", "Bomper", "Chaco", "Eslinga", "Mosqueton", "Hamburguesa", "Tubo", "Atril", "TV", "Control", "Cable", "Pulpo", "Parcial", "Alargue", "Brazos", "Tornillos", "Contrapeso", "Regleta", "Planchon"];
            const isAutoComp = autoCompKeys.some(k => subcat.includes(k));
            const wasAutoComp = autoCompKeys.some(k => equipoActual.includes(k));
            
            if (isAutoComp) {
                document.getElementById("equipo").value = subcat.replace(/[\[\]]/g, "");
            } else if (wasAutoComp) {
                document.getElementById("equipo").value = "";
            }
        }
    }

    function calcularFormulas() {
        const subcat = document.getElementById("subcategoria").value;
        const dimH = parseFloat(document.getElementById("dim-horizontal").value);
        const dimV = parseFloat(document.getElementById("dim-vertical").value);
        const esCable20m = subcat.toLowerCase().includes("cable") && subcat.includes("20");
        const esPulpo = subcat.toLowerCase().includes("pulpo");
        const esBrazo = subcat.toLowerCase().includes("brazos");
        const esHamburguesaPitch = subcat.toLowerCase().includes("hamburguesa pantalla pitch");
        const esArmado = subcat.includes("Armado Completo");
        
        // Para patas solo exigimos dimH, para los demás dimH y dimV
        const isValidDims = (subcat.toLowerCase().includes("patas") || esBrazo) ? (dimH > 0) : (dimH > 0 && dimV > 0);
        if ((subcat.toLowerCase().includes("pitch") || subcat.toLowerCase().includes("puente") || subcat.toLowerCase().includes("patas") || subcat.toLowerCase().includes("escalerilla") || esCable20m || esPulpo || esBrazo || esHamburguesaPitch || esArmado) && isValidDims) {
            if (esArmado) {
                const pitch = document.getElementById("tipo-pitch-cable").value;
                const divisor = (pitch === "2.6") ? 2 : 1.5;
                const racks = Math.ceil((dimH * dimV) / divisor);
                document.getElementById("equipo").value = `Racks de pantalla ${pitch}`;
                document.getElementById("cantidad").value = racks;
                document.getElementById("cantidad").readOnly = true;
            } else
            
            
                        if (esBrazo) {
                let patas = Math.ceil(((dimH - 1) / 2.5) + 1);
                if (patas % 2 !== 0) {
                    patas += 1; // Si es impar, sumamos 1 para que sea par
                }
                const totalBrazos = patas / 2;

                const nombreEquipo = subcat.replace(/[\[\]]/g, "");
                document.getElementById("equipo").value = nombreEquipo;
                document.getElementById("cantidad").value = totalBrazos;
                document.getElementById("cantidad").readOnly = true;

            } else if (esPulpo) {
                const totalCab = (dimH * 2) * (dimV * 2);
                const totalPulpos = Math.ceil(totalCab / 40);

                const nombreEquipo = subcat.replace(/[\[\]]/g, "");
                document.getElementById("equipo").value = nombreEquipo;
                document.getElementById("cantidad").value = totalPulpos;
                document.getElementById("cantidad").readOnly = true;

            } else if (esCable20m) {
                const pitchSel = document.getElementById("tipo-pitch-cable").value;
                const totalCab = (dimH * 2) * (dimV * 2);
                const divisor = pitchSel === "2.9" ? 20 : 16;
                const baseRes = totalCab / divisor;
                let finalRes = 0;
                
                if (baseRes >= 10 && baseRes <= 20) {
                    finalRes = Math.floor(baseRes) + 3;
                } else if (baseRes > 20) {
                    finalRes = Math.floor(baseRes) + 4;
                } else {
                    finalRes = Math.floor(baseRes) + 1;
                }

                const nombreEquipo = subcat.replace(/[\[\]]/g, "");
                document.getElementById("equipo").value = nombreEquipo;
                document.getElementById("cantidad").value = finalRes;
                document.getElementById("cantidad").readOnly = true;

            } else if (subcat.toLowerCase().includes("patas")) {
                const totalPatas = Math.ceil(((dimH - 1) / 2.5) + 1);
                const nombreEquipo = subcat.replace(/[\[\]]/g, "");
                document.getElementById("equipo").value = nombreEquipo;
                document.getElementById("cantidad").value = totalPatas;
                document.getElementById("cantidad").readOnly = true;
            } else if (subcat.toLowerCase().includes("escalerilla") || esHamburguesaPitch) {
                const ensamble = document.getElementById("tipo-ensamble").value;
                const patas = Math.ceil(((dimH - 1) / 2.5) + 1); // Recalculamos las patas
                let cantidad = 0;
                
                if (ensamble === "tarima") {
                    // Altura vertical - 1, por patas
                    const factorVertical = Math.max(0, dimV - 1);
                    cantidad = Math.ceil(patas * factorVertical);
                } else if (ensamble === "inferior") {
                    // Altura vertical - 0.5, por patas
                    const factorVertical = Math.max(0, dimV - 0.5);
                    cantidad = Math.ceil(patas * factorVertical);
                } else {
                    // Superiores a 60cm
                    // Altura vertical + 1, por patas
                    const factorVertical = dimV + 1;
                    cantidad = Math.ceil(patas * factorVertical);
                }
                
                const nombreEquipo = subcat.replace(/[\[\]]/g, "");
                document.getElementById("equipo").value = nombreEquipo;
                document.getElementById("cantidad").value = cantidad;
                document.getElementById("cantidad").readOnly = true;
            } else if (subcat.includes("Pantalla LED")) {
                const area = dimH * dimV;
                let divisor = subcat.includes("2.6") ? 2 : 1.5;
                const racks = Math.ceil(area / divisor);
                const pitch = subcat.includes("2.9") ? "2.9" : "2.6";
                
                document.getElementById("equipo").value = `Racks de pantalla ${pitch}`;
                document.getElementById("cantidad").value = racks;
                document.getElementById("cantidad").readOnly = true;
            } 
            else if (subcat.includes("Puente")) {
                // Formula base: (H * 2) * (V * 2)
                let totalCables = Math.ceil((dimH * 2) * (dimV * 2));
                
                // Condición: sumar 5 unidades adicionales por cada bloque de 100
                if (totalCables > 0) {
                    const extra = Math.ceil(totalCables / 100) * 5;
                    totalCables += extra;
                }
                
                const nombreEquipo = subcat.replace(/[\[\]]/g, "");
                document.getElementById("equipo").value = nombreEquipo;
                document.getElementById("cantidad").value = totalCables;
                document.getElementById("cantidad").readOnly = true;
            }
        } else {
            document.getElementById("cantidad").readOnly = false;
        }
    }

    async function enviarDatos() {
        const categoria = document.getElementById("categoria").value;
        let equipo = document.getElementById("equipo").value.trim();
        const cantidad = document.getElementById("cantidad").value;
        const subcategoria = document.getElementById("subcategoria").value;
        const dimHorizontal = document.getElementById("dim-horizontal").value;
        const dimVertical = document.getElementById("dim-vertical").value;
        const messageDiv = document.getElementById("message");
        
        if (!categoria) {
            showMessage("Por favor, selecciona una categoría.", false);
            return;
        }
        
        if (subcategoria.includes("Pantalla LED") || subcategoria.includes("Armado Completo")) {
            if (!dimHorizontal || !dimVertical) {
                showMessage("Por favor, ingresa las dimensiones de la pantalla (Horizontal y Vertical).", false);
                return;
            }
        }

        if (!equipo) {
            showMessage("Por favor, escribe la descripción del equipo.", false);
            return;
        }
        
        // Si es general (ej. otro tipo de video), agregamos la subcategoría si la tiene
        if (!subcategoria.includes("Pantalla LED") && categoria === "VIDEO" && !subcategoria.includes("Cable") && subcategoria !== "") {
            equipo = `${subcategoria} ${equipo}`;
        }

        if (!cantidad || cantidad < 1) {
            showMessage("Por favor, ingresa una cantidad válida.", false);
            return;
        }

        let data = [];
        
        if (subcategoria.includes("Armado Completo")) {
            const pitch = document.getElementById("tipo-pitch-cable").value;
            const H = parseFloat(dimHorizontal);
            const V = parseFloat(dimVertical);
            const ensamble = document.getElementById("tipo-ensamble").value;
            
            // 1. Racks de pantalla (Pitch 2.6 -> divisor 2 | Pitch 2.9 -> divisor 1.5, redondeo hacia arriba)
            const divisor = (pitch === "2.6") ? 2 : 1.5;
            const racks = Math.ceil((H * V) / divisor);
            data.push({
                categoria: "PANTALLA LED",
                equipo: `Racks de pantalla ${pitch}`,
                cantidad: racks
            });

            // 2. Patas estructura pantalla: (((H - 1) / 2.5) + 1)
            const patas = Math.ceil(((H - 1) / 2.5) + 1);
            data.push({
                categoria: "PANTALLA LED",
                equipo: "Patas estructura pantalla",
                cantidad: patas
            });

            // 3. Brazos Extensores de 2.5 mts: si patas es impar suma 1, luego divide entre 2
            const patas_par = (patas % 2 !== 0) ? patas + 1 : patas;
            const brazos = patas_par / 2;
            data.push({
                categoria: "PANTALLA LED",
                equipo: "Brazos Extensores de 2.5 mts",
                cantidad: brazos
            });

            // 4. Escalerillas, Hamburguesas y Tornillos
            if (ensamble !== "ninguna") {
                let esc = 0;
                if (ensamble === "tarima") {
                    esc = Math.ceil(patas * Math.max(0, V - 1));
                } else if (ensamble === "inferior") {
                    esc = Math.ceil(patas * Math.max(0, V - 0.5));
                } else if (ensamble === "superior") {
                    esc = Math.ceil(patas * (V + 1));
                }
                
                if (esc > 0) {
                    data.push({ categoria: "PANTALLA LED", equipo: "Escalerilla estructura pantalla", cantidad: esc });
                    data.push({ categoria: "PANTALLA LED", equipo: `Hamburguesa Pantalla pitch ${pitch}`, cantidad: esc });
                    data.push({ categoria: "PANTALLA LED", equipo: "Tornillos Pantalla led", cantidad: esc * 4 });
                }
            }
        } else {
            data.push({
                categoria: categoria,
                equipo: equipo,
                cantidad: parseInt(cantidad)
            });
        }

        if (subcategoria.toLowerCase().includes("hamburguesa pantalla pitch") && !subcategoria.includes("Armado Completo")) {
            data.push({
                categoria: "PANTALLA LED",
                equipo: "Tornillos Pantalla led",
                cantidad: parseInt(cantidad) * 4
            });
        }

        try {
            const response = await fetch('/equipos/batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                showMessage(`¡"${equipo}" agregado al grupo de ${categoria} con éxito!`, true);
                // Limpiar el campo del equipo para que puedan agregar el siguiente rápido
                document.getElementById("equipo").value = "";
                document.getElementById("cantidad").value = "1";
                document.getElementById("equipo").focus();
                
                // Refrescar la tabla automáticamente
                cargarTabla();
            } else {
                const err = await response.json();
                showMessage("Error: " + err.detail, false);
            }
        } catch (error) {
            showMessage("Error de conexión con la API.", false);
        }
    }

    async function abrirExcel() {
        try {
            const response = await fetch('/abrir-excel');
            if (!response.ok) {
                const err = await response.json();
                showMessage("Error: " + err.detail, false);
            } else {
                showMessage("Abriendo Excel...", true);
            }
        } catch (error) {
            showMessage("Error de conexión con la API.", false);
        }
    }

    function descargarExcel() {
        window.location.href = '/descargar-excel';
    }

    function showMessage(text, isSuccess) {
        const msgDiv = document.getElementById("message");
        msgDiv.textContent = text;
        msgDiv.className = isSuccess ? "success" : "error";
        msgDiv.classList.remove("hidden");
        setTimeout(() => msgDiv.classList.add("hidden"), 5000);
    }
